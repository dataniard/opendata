version: '3.8'

services:
  # PostgreSQL - Base de datos para Hive Metastore y auditoría
  postgres:
    image: postgres:15-alpine
    container_name: opendata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      POSTGRES_DB: ${POSTGRES_DB:-hive_metastore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/:/docker-entrypoint-initdb.d/:ro
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-hive_metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Almacenamiento de objetos S3-compatible
  minio:
    image: minio/minio:latest
    container_name: opendata-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - opendata-network
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore - Catálogo de metadatos
  hive-metastore:
    image: bde2020/hive:2.3.9-postgresql-metastore
    container_name: opendata-hive-metastore
    environment:
      SERVICE_NAME: hive-metastore
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-opendata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      DB_NAME: ${POSTGRES_DB:-hive_metastore}
      WAREHOUSE_LOCATION: s3a://iceberg-data
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Spark Master
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: opendata-spark-master
    environment:
      INIT_DAEMON_STEP: setup_spark
      SPARK_MASTER_HOST: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: 'no'
      SPARK_RPC_ENCRYPTION_ENABLED: 'no'
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: 'no'
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    volumes:
      - ./scripts:/scripts:ro
      - ./config/spark/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  # Apache Spark Worker 1
  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: opendata-spark-worker-1
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - opendata-network

  # Apache Spark Worker 2
  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: opendata-spark-worker-2
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8082
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "8082:8082"
    depends_on:
      - spark-master
    networks:
      - opendata-network

  # Trino (PrestoSQL) - Motor de consultas SQL
  trino:
    image: trinodb/trino:latest
    container_name: opendata-trino
    ports:
      - "8888:8080"
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ui/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Superset - Visualización y BI
  superset:
    image: apache/superset:latest
    container_name: opendata-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-your-secret-key-change-in-prod}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin123}
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    networks:
      - opendata-network
    volumes:
      - superset_data:/var/lib/superset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch - Motor de búsqueda para OpenMetadata (catálogo/linaje)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: opendata-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP:-1G} -Xmx${ELASTICSEARCH_HEAP:-1G}
      - xpack.security.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # OpenMetadata - Migración inicial del esquema (job one-shot)
  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-1.12.14}
    container_name: opendata-openmetadata-migrate
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${OPENMETADATA_PORT:-8585}
      SERVER_ADMIN_PORT: ${OPENMETADATA_ADMIN_PORT:-8586}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIGRATION_LIMIT_PARAM: ${MIGRATION_LIMIT_PARAM:-1200}
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: 'false'
      AUTHENTICATION_PROVIDER: basic
      RSA_PUBLIC_KEY_FILE_PATH: "./conf/public_key.der"
      RSA_PRIVATE_KEY_FILE_PATH: "./conf/private_key.der"
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      PIPELINE_SERVICE_CLIENT_ENABLED: 'true'
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USER: ${OPENMETADATA_DB_USER:-openmetadata}
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-changeme-om123!}
      DB_HOST: postgres
      DB_PORT: 5432
      OM_DATABASE: ${OPENMETADATA_DB:-openmetadata_db}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      SECRET_MANAGER: db
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - opendata-network

  # OpenMetadata Server - Catálogo y gobierno del dato (UI :8585)
  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-1.12.14}
    container_name: opendata-openmetadata-server
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${OPENMETADATA_PORT:-8585}
      SERVER_ADMIN_PORT: ${OPENMETADATA_ADMIN_PORT:-8586}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: 'false'
      AUTHENTICATION_PROVIDER: basic
      RSA_PUBLIC_KEY_FILE_PATH: "./conf/public_key.der"
      RSA_PRIVATE_KEY_FILE_PATH: "./conf/private_key.der"
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      PIPELINE_SERVICE_CLIENT_ENABLED: 'true'
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USER: ${OPENMETADATA_DB_USER:-openmetadata}
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-changeme-om123!}
      DB_HOST: postgres
      DB_PORT: 5432
      OM_DATABASE: ${OPENMETADATA_DB:-openmetadata_db}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      SECRET_MANAGER: db
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
      - "${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10

  # OpenMetadata Ingestion - Airflow standalone para ingestas de metadatos (UI :8090)
  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.14}
    container_name: opendata-openmetadata-ingestion
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: postgres
      DB_PORT: 5432
      AIRFLOW_DB: ${OPENMETADATA_INGESTION_DB:-openmetadata_ingestion_db}
      DB_USER: ${OPENMETADATA_DB_USER:-openmetadata}
      DB_SCHEME: postgresql+psycopg2
      DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-changeme-om123!}
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    ports:
      - "${OPENMETADATA_INGESTION_PORT:-8090}:8080"
    depends_on:
      elasticsearch:
        condition: service_started
      postgres:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    networks:
      - opendata-network
    volumes:
      - openmetadata_ingestion_dags:/opt/airflow/dags
      - openmetadata_ingestion_tmp:/tmp

  # Apache Airflow - Orquestación de pipelines ETL
  airflow-init:
    image: apache/airflow:2.8.3
    container_name: opendata-airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://opendata:changeme123!@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-airflow-fernet-key-1234}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__RBAC: 'True'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opendata-network
    command: >
      bash -lc "airflow db init && \
      airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com --password admin && \
      exit 0"

  airflow-webserver:
    image: apache/airflow:2.8.3
    container_name: opendata-airflow-webserver
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://opendata:changeme123!@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-airflow-fernet-key-1234}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__RBAC: 'True'
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/scripts:ro
    depends_on:
      - airflow-init
      - postgres
    networks:
      - opendata-network
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.8.3
    container_name: opendata-airflow-scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://opendata:changeme123!@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-airflow-fernet-key-1234}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__RBAC: 'True'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/scripts:ro
    depends_on:
      - airflow-webserver
      - postgres
    networks:
      - opendata-network
    command: scheduler

  # MinIO Client init (para crear buckets)
  minio-init:
    image: minio/mc:latest
    container_name: opendata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-changeme123!} --api S3v4 &&
      /usr/bin/mc mb --ignore-existing minio/iceberg-data &&
      /usr/bin/mc mb --ignore-existing minio/warehouse &&
      /usr/bin/mc mb --ignore-existing minio/logs &&
      /usr/bin/mc version enable minio/iceberg-data &&
      /usr/bin/mc version enable minio/warehouse &&
      exit 0
      "
    networks:
      - opendata-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  superset_data:
    driver: local
  elasticsearch_data:
    driver: local
  openmetadata_ingestion_dags:
    driver: local
  openmetadata_ingestion_tmp:
    driver: local

networks:
  opendata-network:
    driver: bridge
