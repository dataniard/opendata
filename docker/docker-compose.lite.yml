version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opendata-postgres-lite
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      POSTGRES_DB: ${POSTGRES_DB:-hive_metastore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/:/docker-entrypoint-initdb.d/:ro
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-hive_metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: opendata-minio-lite
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - opendata-network
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: bde2020/hive:2.3.9-postgresql-metastore
    container_name: opendata-hive-metastore-lite
    environment:
      SERVICE_NAME: hive-metastore
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-opendata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      DB_NAME: ${POSTGRES_DB:-hive_metastore}
      WAREHOUSE_LOCATION: s3a://iceberg-data
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: opendata-spark-master-lite
    environment:
      INIT_DAEMON_STEP: setup_spark
      SPARK_MASTER_HOST: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: 'no'
      SPARK_RPC_ENCRYPTION_ENABLED: 'no'
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: 'no'
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    volumes:
      - ./scripts:/scripts:ro
      - ./config/spark/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: opendata-spark-worker-1-lite
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_WEBUI_PORT: 8081
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - opendata-network

networks:
  opendata-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
