version: '3.8'

services:
  # PostgreSQL - Base de datos para Hive Metastore y auditoría
  postgres:
    image: postgres:15-alpine
    container_name: opendata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      POSTGRES_DB: ${POSTGRES_DB:-hive_metastore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-hive_metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Almacenamiento de objetos S3-compatible
  minio:
    image: minio/minio:latest
    container_name: opendata-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - opendata-network
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore - Catálogo de metadatos
  hive-metastore:
    image: bde2020/hive:2.3.9-postgresql-metastore
    container_name: opendata-hive-metastore
    environment:
      SERVICE_NAME: hive-metastore
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-opendata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme123!}
      DB_NAME: ${POSTGRES_DB:-hive_metastore}
      WAREHOUSE_LOCATION: s3a://iceberg-data
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme123!}
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Spark Master
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: opendata-spark-master
    environment:
      INIT_DAEMON_STEP: setup_spark
      SPARK_MASTER_HOST: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: 'no'
      SPARK_RPC_ENCRYPTION_ENABLED: 'no'
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: 'no'
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    volumes:
      - ./scripts:/scripts:ro
      - ./config/spark/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  # Apache Spark Worker 1
  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: opendata-spark-worker-1
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - opendata-network

  # Apache Spark Worker 2
  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: opendata-spark-worker-2
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8082
      CORE_CONF_fs_s3a_endpoint: http://minio:9000
      CORE_CONF_fs_s3a_access_key: ${MINIO_ROOT_USER:-minioadmin}
      CORE_CONF_fs_s3a_secret_key: ${MINIO_ROOT_PASSWORD:-changeme123!}
      CORE_CONF_fs_s3a_path_style_access: 'true'
      CORE_CONF_fs_s3a_connection_ssl_enabled: 'false'
    ports:
      - "8082:8082"
    depends_on:
      - spark-master
    networks:
      - opendata-network

  # Trino (PrestoSQL) - Motor de consultas SQL
  trino:
    image: trinodb/trino:latest
    container_name: opendata-trino
    ports:
      - "8888:8080"
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - opendata-network
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ui/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Superset - Visualización y BI
  superset:
    image: apache/superset:latest
    container_name: opendata-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-your-secret-key-change-in-prod}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin123}
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    networks:
      - opendata-network
    volumes:
      - superset_data:/var/lib/superset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Client init (para crear buckets)
  minio-init:
    image: minio/mc:latest
    container_name: opendata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-changeme123!} --api S3v4 &&
      /usr/bin/mc mb --ignore-existing minio/iceberg-data &&
      /usr/bin/mc mb --ignore-existing minio/warehouse &&
      /usr/bin/mc mb --ignore-existing minio/logs &&
      /usr/bin/mc version enable minio/iceberg-data &&
      /usr/bin/mc version enable minio/warehouse &&
      exit 0
      "
    networks:
      - opendata-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  superset_data:
    driver: local

networks:
  opendata-network:
    driver: bridge
